name: sync YouTube analytics

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-youtube-analytics
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger Sovia analytics sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$CRON_SECRET"
          test -n "$SITE_URL"
          curl --fail-with-body --show-error --silent \
            --retry 2 \
            --retry-all-errors \
            --max-time 600 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/youtube-analytics"
