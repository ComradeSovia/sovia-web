name: refresh music publication

on:
  schedule:
    # GitHub Actions schedules use UTC. Run often enough that normal syncs only
    # need the first page; large gaps continue from the stored page cursor.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-music-publication
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Refresh music publication
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$CRON_SECRET"
          test -n "$SITE_URL"
          curl --fail-with-body --show-error --silent \
            --retry 2 \
            --retry-all-errors \
            --max-time 300 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/music-publication"
